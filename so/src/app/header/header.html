<header>
  <div class="left-menu">
    <button #menuToggle type="button" class="icon-container" aria-label="פתיחת תפריט" aria-controls="shop-menu" [attr.aria-expanded]="isMenuOpen" data-tooltip="תפריט" (click)="toggleMenu()">
      <svg aria-hidden="true" viewBox="0 0 24 24">
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>
  </div>

  <a routerLink="/" class="logo-link">
    <span class="logo">SO.</span>
  </a>

  <div class="right-icons">
    <a routerLink="/search" class="icon-container" aria-label="חיפוש" data-tooltip="חיפוש">
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
    </a>
    <a routerLink="/account" class="icon-container" aria-label="החשבון שלי" data-tooltip="החשבון שלי">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>
    </a>
    <a routerLink="/favorites" class="icon-container" aria-label="מועדפים" data-tooltip="מועדפים">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" /></svg>
    </a>
    <a routerLink="/cart" class="icon-container" aria-label="עגלת קניות" data-tooltip="עגלת קניות">
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1" /><circle cx="20" cy="21" r="1" /><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" /></svg>
      <span class="cart-badge" *ngIf="cartService.itemCount() > 0">{{ cartService.itemCount() }}</span>
    </a>
  </div>
</header>

<div class="overlay" [class.active]="isMenuOpen" (click)="toggleMenu()"></div>

<div role="dialog" aria-modal="true" aria-label="תפריט החנות" #menuPanel id="shop-menu" class="side-menu" [class.open]="isMenuOpen" [attr.inert]="isMenuOpen?null:''" [attr.aria-hidden]="!isMenuOpen" (keydown)="menuKey($event)">
  <div class="menu-header">
    <button type="button" class="close-btn" aria-label="סגירת תפריט" (click)="toggleMenu()">✕</button>
    <span>תפריט</span>
  </div>

  <nav>
    <a routerLink="/catalog" (click)="toggleMenu()">כל המטפחות</a>
    <a routerLink="/crepe-satin" (click)="toggleMenu()">מטפחות קרפ סאטן</a>
    <a routerLink="/silk-scarves" (click)="toggleMenu()">מטפחות משי</a>
    <a routerLink="/cotton-scarves" (click)="toggleMenu()">מטפחות כותנה</a>
    <a routerLink="/summer-collection" (click)="toggleMenu()">קולקציית קיץ 26</a>
    <a routerLink="/our-story" (click)="toggleMenu()">OUR STORY ♡</a>
    <a routerLink="/sale" (click)="toggleMenu()" style="color: #a52555;">SALE</a>
  </nav>
</div>
