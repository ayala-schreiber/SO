<h1 class="sr-only">SO — מטפחות</h1>
<div class="chat-container" (keydown.escape)="closeChat()">

  <button type="button" class="whatsapp-float" #chatToggle [attr.aria-expanded]="chatOpen()" aria-controls="chat-modal" aria-label="פתיחת אפשרויות פנייה בוואטסאפ" (click)="toggleChat()">
    <span>CHAT</span>
    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
    </svg>
  </button>

  <div id="chat-modal" class="chat-modal" [hidden]="!chatOpen()" dir="rtl">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" aria-label="סגירת חלונית פנייה" class="close-btn" (click)="closeChat()">&times;</button>
        <span class="header-title">WhatsApp</span>
      </div>
      <div class="modal-body">
        <h3>שלום וברוכים הבאים ל-SO.</h3>
        <p>איך נוכל לעזור?<br>התחילי צ'אט עכשיו ונחזור אליך בהקדם.</p>
      </div>
      @if(contact.phone()){<a [href]="contact.whatsapp()" target="_blank" rel="noopener noreferrer" class="start-chat-btn">פתיחת שיחה בוואטסאפ</a>}
    </div>
  </div>

</div>

<div class="hero">
  <video #heroVideo [muted]="true" loop playsinline (play)="playing.set(true)" (pause)="playing.set(false)" aria-label="סרטון המותג SO" class="hero-video">
    <source src="/brand-video.mp4" type="video/mp4">
  </video>

  <div class="hero-overlay"></div>

  <div class="hero-content" lang="en" dir="ltr">
    <p>SO Elegant.</p>
    <p>SO You.</p>
    <p>SO Simple.</p>
    <p>just SO.</p>
  </div>
</div>

<app-catalog [featured]="true" />
