<div class="category-header">
  <h2 class="page-title">מטפחות כותנה</h2>
</div>

<div class="products-grid">
  <div *ngFor="let scarf of cottonScarves()" class="product-card">
    <div class="product-image-wrapper">
      <img [src]="scarf.imageUrl" [alt]="scarf.name">

      <div class="card-icons">
        <button class="card-icon-btn" title="תצוגה מהירה">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
        </button>
        <button class="card-icon-btn" title="הוסף למועדפים">
          <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" /></svg>
        </button>
      </div>

      <button class="cart-bar" (click)="addToCart(scarf)" title="הוסף לסל">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1" /><circle cx="20" cy="21" r="1" /><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" /></svg>
      </button>
    </div>

    <h3 class="product-name">{{ scarf.name }}</h3>
    <p class="current-price">{{ scarf.price }} ₪</p>
  </div>
</div>
